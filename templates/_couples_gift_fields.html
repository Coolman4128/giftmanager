<!-- Couple's Gift Section -->
<div class="p-4 bg-gray-50 border border-gray-300 rounded-lg" data-couples-section>
  <h2 class="text-lg font-bold text-gray-700 mb-4">Couple's Gift</h2>
  <div class="flex items-center gap-2">
    {{ form.is_couples_gift }}
    <label for="{{ form.is_couples_gift.id_for_label }}" class="font-bold text-gray-700">
      Is this a couple's gift?
    </label>
  </div>
  <p class="text-sm text-gray-500 mt-1">
    A couple's gift is hidden from both people it is for, so neither of them can see
    who claimed it. Only you can edit it.
  </p>

  <div class="mt-4 {% if not form.is_couples_gift.value %}hidden{% endif %}" data-couples-panel>
    <label for="{{ form.couple_partner.id_for_label }}" class="block font-bold text-gray-700 mb-1">
      Other person in the couple
    </label>
    <input
      type="text"
      placeholder="Search family members..."
      autocomplete="off"
      class="w-full border border-gray-300 rounded-lg p-2 mb-2 focus:outline-none focus:ring focus:ring-green-300"
      data-couples-search>
    {{ form.couple_partner }}
    {% if form.couple_partner.errors %}
      <p class="text-red-600 text-sm mt-1">{{ form.couple_partner.errors|join:", " }}</p>
    {% endif %}
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const section = document.querySelector('[data-couples-section]');
    if (!section) return;

    const toggle = section.querySelector('[data-couples-toggle]');
    const panel = section.querySelector('[data-couples-panel]');
    const search = section.querySelector('[data-couples-search]');
    const select = section.querySelector('[data-couples-select]');
    const options = Array.from(select.options);

    toggle.addEventListener('change', () => {
      panel.classList.toggle('hidden', !toggle.checked);
      if (toggle.checked) {
        search.focus();
      }
    });

    search.addEventListener('input', () => {
      const term = search.value.trim().toLowerCase();
      options.forEach(option => {
        // Never hide the placeholder or the current pick.
        option.hidden = Boolean(option.value)
          && !option.selected
          && !option.text.toLowerCase().includes(term);
      });
    });
  });
</script>
